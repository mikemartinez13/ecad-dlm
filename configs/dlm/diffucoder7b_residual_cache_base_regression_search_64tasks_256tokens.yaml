# Historical run identifier retained for existing results and checkpoint resume.
run:
  name: diffucoder7b_code_baseobj_evalplus_64_len256_finegroups
  resume: true

model:
  family: diffucoder
  path: /scratch/gqs7zr/model_checkpoints/models--apple--DiffuCoder-7B-cpGRPO/snapshots/98bc42bfd871eeec92fd0a8439ab34f75b405204
  device: cuda
  dtype: bfloat16
  local_files_only: true

generation:
  steps: 256
  gen_length: 256
  temperature: 0.4
  top_p: 0.95
  top_k: null
  algorithm: entropy
  algorithm_temperature: 0.0

schedule:
  # A cached decision now spans only two denoising steps and two layers.
  step_group_size: 2
  layer_group_size: 2
  attention_weight: null
  mlp_weight: null
  fixed_step_weight: null

evaluation:
  source: evalplus
  code_tasks_file: /sfs/gpfs/tardis/home/gqs7zr/ai4mat/ecad/data/code/humaneval_mbpp_64_strict_python_seed0.jsonl
  code_datasets: [humaneval, mbpp]
  code_seed: 0
  code_prompt_style: strict_python
  max_prompts: 64
  batch_size: 1
  baseline_warmup_runs: 1
  save_decoded_text: true

  # Optimize paired regressions on official public base tests. EvalPlus Plus is
  # deliberately excluded from evolution and remains post-hoc/held-out.
  quality_objective: base_regression_rate
  evalplus_image: /scratch/gqs7zr/apptainer/evalplus.sif
  evalplus_humaneval_path: /scratch/gqs7zr/evalplus_data/HumanEvalPlus.jsonl
  evalplus_mbpp_path: /scratch/gqs7zr/evalplus_data/MbppPlus.jsonl
  evalplus_parallel: 8
  evalplus_apptainer_bin: apptainer
  evalplus_timeout_seconds: 1800
  max_syntax_invalid: 0

  # Reused only when its generation signature, including GPU type, matches.
  # Otherwise the runner generates a fresh paired all-recompute baseline.
  baseline_artifact: /scratch/gqs7zr/ai4mat/ecad/results/dlm_ecad/diffucoder7b_code_evalplus_64_len256/baseline.json

evolution:
  population_size: 8
  generations: 20
  seed: 0
  crossover_probability: 0.9
  crossover_points: 4
  # Keep the first population close to all-recompute, then make about two
  # grouped cache-decision changes per child regardless of genome length.
  initial_cached_groups: 16
  mutation_expected_flips: 2
  initial_recompute_probability: 1.0  # legacy fallback; ignored above
  min_cached_groups: 1
