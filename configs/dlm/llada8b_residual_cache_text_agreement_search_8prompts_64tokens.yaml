# Historical run identifier retained for existing results and checkpoint resume.
run:
  name: llada8b_ecad_pilot
  resume: true

model:
  family: llada
  path: /scratch/gqs7zr/model_checkpoints/models--GSAI-ML--LLaDA-8B-Instruct/snapshots/08b83a6feb34df1a6011b80c3c00c7563e963b07
  device: cuda
  dtype: bfloat16
  local_files_only: true

# There are two 32-token blocks and 32 local denoising steps per block.
# The same evolved local schedule is reused for both blocks.
generation:
  steps: 64
  gen_length: 64
  block_length: 32
  temperature: 0.0
  cfg_scale: 0.0
  remasking: low_confidence
  mask_id: 126336

# 31 cacheable local steps -> 8 groups; 32 layers -> 8 groups; two branch
# types. This gives a compact 128-bit genome instead of 2,048 raw decisions.
schedule:
  step_group_size: 4
  layer_group_size: 4
  attention_weight: null
  mlp_weight: null
  fixed_step_weight: null

evaluation:
  prompts_file: /sfs/gpfs/tardis/home/gqs7zr/ai4mat/ecad/prompts/dlm_text_generation_prompts.txt
  max_prompts: 8
  batch_size: 1
  baseline_warmup_runs: 1
  save_decoded_text: true

# ECAD's NSGA-II operators with a smaller first-pass population. All objectives
# are minimized: token disagreement from baseline and estimated compute ratio.
evolution:
  population_size: 16
  generations: 10
  seed: 0
  crossover_probability: 0.9
  crossover_points: 4
  mutation_probability: 0.05
  initial_recompute_probability: 0.8
  min_cached_groups: 1
