# E2 + E3 + proxy validation, all under greedy decoding (temperature 0).
# dense_repeat checks determinism; dense_math_attention measures the rounding
# noise floor. The 15 cached policies range from harmless to clearly broken.
# Each gets an end-to-end run with tests here and a forced-trajectory replay,
# and dlm_kv_policy/PROXY_VALIDATION.md compares the two.
#   python -m dlm_kv_policy.output_variance_study --config <this file>
#   python -m dlm_kv_policy.forced_trajectory_replay --config <this file>
#   python -m dlm_kv_policy.validate_proxy --config <this file> --gpu-folder <GPU folder>
run:
  name: diffucoder7b_output_variance_greedy_v1
  resume: true

model:
  path: /scratch/gqs7zr/model_checkpoints/models--apple--DiffuCoder-7B-cpGRPO/snapshots/98bc42bfd871eeec92fd0a8439ab34f75b405204
  device: cuda
  dtype: bfloat16
  local_files_only: true

generation:
  steps: 256
  gen_length: 256
  temperature: 0.0
  top_p: 1.0
  top_k: null
  algorithm: entropy
  algorithm_temperature: 0.0
  seed: 0

evaluation:
  code_tasks_file: /sfs/gpfs/tardis/home/gqs7zr/ecad/data/code/humaneval_mbpp_64_strict_python_seed0.jsonl
  max_prompts: 64
  prompt_batch_size: 1
  evalplus_image: /scratch/gqs7zr/apptainer/evalplus.sif
  evalplus_humaneval_path: /scratch/gqs7zr/evalplus_data/HumanEvalPlus.jsonl
  evalplus_mbpp_path: /scratch/gqs7zr/evalplus_data/MbppPlus.jsonl
  evalplus_parallel: 8
  evalplus_apptainer_bin: apptainer
  evalplus_timeout_seconds: 1800

fixed_policy_evaluation:
  policies: [dense]

policies:
  dense:
    force_dense: true

# The 15 policies of the proxy validation set. Edit them only before results exist.
dkv_policies:
  # Control: nothing is reused, so any drift is backend rounding only.
  full_refresh_every_step:
    cache_reloading_step: 1
  # Full refresh interval, from frequent to never (step 0 and 1 only).
  refresh_2:
    cache_reloading_step: 2
  refresh_4:
    cache_reloading_step: 4
  dkv_reference: {}            # refresh every 8 steps, delay 1
  refresh_16:
    cache_reloading_step: 16
  refresh_32:
    cache_reloading_step: 32
  refresh_64:
    cache_reloading_step: 64
  refresh_256:
    cache_reloading_step: 256
  # Delay before a newly decoded token's K/V is reused.
  delay_0:                      # known-bad: reused immediately
    additional_decoded_forwards: 0
  delay_2:
    additional_decoded_forwards: 2
  # Stable rows also recompute layers 15..28 or 22..28 every step.
  depth_15:
    refresh_depth: 15
  depth_22:
    refresh_depth: 22
  # Combinations.
  refresh_32_depth_22:
    cache_reloading_step: 32
    refresh_depth: 22
  refresh_64_delay_2:
    cache_reloading_step: 64
    additional_decoded_forwards: 2
  delay_0_refresh_32:
    cache_reloading_step: 32
    additional_decoded_forwards: 0

variance_study:
  reference: dense
  variants:
    - name: dense
    - name: dense_repeat
      generation: {seed: 1000}   # greedy ignores the seed, so this must be identical
    - name: dense_math_attention
      sdpa_backend: math
    # One end-to-end run per validation policy; names match dkv_policies.
    - {name: full_refresh_every_step, policy: full_refresh_every_step}
    - {name: refresh_2, policy: refresh_2}
    - {name: refresh_4, policy: refresh_4}
    - {name: dkv_reference, policy: dkv_reference}
    - {name: refresh_16, policy: refresh_16}
    - {name: refresh_32, policy: refresh_32}
    - {name: refresh_64, policy: refresh_64}
    - {name: refresh_256, policy: refresh_256}
    - {name: delay_0, policy: delay_0}
    - {name: delay_2, policy: delay_2}
    - {name: depth_15, policy: depth_15}
    - {name: depth_22, policy: depth_22}
    - {name: refresh_32_depth_22, policy: refresh_32_depth_22}
    - {name: refresh_64_delay_2, policy: refresh_64_delay_2}
    - {name: delay_0_refresh_32, policy: delay_0_refresh_32}
