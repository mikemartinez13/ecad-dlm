# NSGA-II over dKV policies, scored by forced-trajectory replay.
# The proxy passed validation on 2026-10-31. Quality ignores position flips
# where dense was tied (see PROXY_VALIDATION.md).
# Objectives: replay divergence events per task and compute fraction (FLOPs),
# both deterministic. Same decoding and tasks as the validation, so the
# validated proxy is the one being optimized. Pin one GPU type with
# --constraint; resuming on a different GPU type is refused.
#   CONFIG_PATH=$PWD/dlm_kv_policy/configs/<this file> KV_POLICY_NSGA2_SEARCH=1 \
#   EVOLUTION_POPULATIONS_PER_JOB=2 sbatch --constraint=a100_80gb --time=24:00:00 \
#   dlm_kv_policy/scripts/slurm/run_diffucoder_kv_policy_experiments.sh
run:
  name: diffucoder7b_dkv_replay_nsga2_greedy_v1
  resume: true

model:
  path: /scratch/gqs7zr/model_checkpoints/models--apple--DiffuCoder-7B-cpGRPO/snapshots/98bc42bfd871eeec92fd0a8439ab34f75b405204
  device: cuda
  dtype: bfloat16
  local_files_only: true

generation:
  steps: 256
  gen_length: 256
  temperature: 0.0
  top_p: 1.0
  top_k: null
  algorithm: entropy
  algorithm_temperature: 0.0
  seed: 0

evaluation:
  code_tasks_file: /sfs/gpfs/tardis/home/gqs7zr/ecad/data/code/humaneval_mbpp_64_strict_python_seed0.jsonl
  max_prompts: 64
  prompt_batch_size: 1
  # EvalPlus settings are used only to check finalists afterwards.
  evalplus_image: /scratch/gqs7zr/apptainer/evalplus.sif
  evalplus_humaneval_path: /scratch/gqs7zr/evalplus_data/HumanEvalPlus.jsonl
  evalplus_mbpp_path: /scratch/gqs7zr/evalplus_data/MbppPlus.jsonl
  evalplus_parallel: 8
  evalplus_apptainer_bin: apptainer
  evalplus_timeout_seconds: 1800

fixed_policy_evaluation:
  policies: [dense]

policies:
  dense:
    force_dense: true

# 3 x 8 x 6 x 3 = 432 policies; 16 x 8 = 128 are evaluated. Each generation is
# one replay of 16 policies sharing a dense pass, with no code execution.
evolution:
  quality_objective: replay_divergence
  population_size: 16
  generations: 8
  seed: 0
  delays: [1, 2, 3]
  refresh_intervals: [4, 8, 12, 16, 24, 32, 48, 64]
  refresh_depths: [1, 15, 18, 20, 22, 24]
  terminal_refresh_steps: [0, 8, 16]
  crossover_probability: 0.9
  two_gene_mutation_probability: 0.2
