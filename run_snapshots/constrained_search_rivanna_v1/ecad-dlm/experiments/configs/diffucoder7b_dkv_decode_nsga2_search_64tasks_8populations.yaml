  evalplus_parallel: 8
  evalplus_apptainer_bin: apptainer
  evalplus_timeout_seconds: 1800
  baseline_warmup_runs: 1
  timing_repeats: 3

fixed_policy_evaluation:
  policies: [dense]
  run_evalplus: true

policies:
  dense:
    force_dense: true

# Eight evaluated populations: generation 0 plus seven evolved populations.
# Each candidate runs all 64 paired EvalPlus Base tasks. During selection, one
# no-diagnostics candidate pass supplies both its output and wall-time objective;
# a dense warm-up and one timed dense pass are shared by the entire Slurm job.
evolution:
  population_size: 8
  generations: 8
  seed: 0
  delays: [1, 2]
  refresh_intervals: [4, 8, 12, 16]
  refresh_depths: [1, 18, 20, 22, 24]
  terminal_refresh_steps: [0, 8, 16]
  crossover_probability: 0.9
  two_gene_mutation_probability: 0.2
