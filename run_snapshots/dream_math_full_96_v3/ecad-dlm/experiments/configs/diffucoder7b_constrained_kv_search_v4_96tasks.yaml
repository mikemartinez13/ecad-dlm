# Constrained search over cache policies: EAR, tail EAR and live answer coverage are
# bounds, FLOPs over dense FLOPs is the one objective. See
# experiments/EAR_VALIDITY_STUDY.md and evolution/constrained_kv_policy_search.py.
# Run 4: run 3's search set and thresholds, with padded FLOPs at batch 8 as the objective
# (approved 2026-11-16), wider gene ranges and more generations (approved 2026-11-15). It starts from run 3's survivors. The added
# values follow run 3's one-gene comparisons, where its leaders sat at a range edge
# that still gained speed, or between two values with a large step (CONSTRAINED_SEARCH.md).
run:
  name: diffucoder_constrained_kv_search_v4
  resume: true
model:
  path: /scratch/gqs7zr/model_checkpoints/models--apple--DiffuCoder-7B-cpGRPO/snapshots/98bc42bfd871eeec92fd0a8439ab34f75b405204
  device: cuda
  dtype: bfloat16
  local_files_only: true
generation:
  steps: 256
  gen_length: 256
  temperature: 0.0
  top_p: 1.0
  top_k: null
  algorithm: entropy
  algorithm_temperature: 0.0
  seed: 0
evaluation:
  code_tasks_file: /sfs/gpfs/tardis/home/gqs7zr/ecad/ecad-dlm/experiments/task_sets/search_96_seed20261107.jsonl
  max_prompts: 96
  prompt_batch_size: 1
  evalplus_image: /scratch/gqs7zr/apptainer/evalplus.sif
  evalplus_humaneval_path: /scratch/gqs7zr/evalplus_data/HumanEvalPlus.jsonl
  evalplus_mbpp_path: /scratch/gqs7zr/evalplus_data/MbppPlus.jsonl
  evalplus_parallel: 8
  evalplus_apptainer_bin: apptainer
  evalplus_timeout_seconds: 1800
fixed_policy_evaluation:
  policies:
  - dense
policies:
  dense:
    force_dense: true
dkv_policies: {}
evolution:
  quality_objective: constrained_batched_time
  population_size: 16
  generations: 64
  seed: 0
  # Depth 1 adds no work; deeper values recompute decoded rows from that layer up,
  # an expensive way to buy EAR in run 3, so depths are unchanged.
  delays: [1, 2, 3]
  refresh_intervals: [4, 8, 16, 32, 64]
  refresh_depths: [1, 18, 22, 24]
  terminal_refresh_steps: [0, 8, 16]
  # Priority 1: masked reuse.
  masked_windows: [1, 2, 4, 8, 16]
  protected_sizes: [8, 12, 16, 20, 24, 32, 48]
  protected_rules: [split, split+recent]
  # Priority 2. Interval 0 means with every full refresh; 256 means the prompt is
  # computed once, at step 0.
  prompt_refresh_intervals: [0, 8, 32, 64, 128, 256]
  local_refresh_radii: [0, 2, 4, 6, 8]
  # Priority 3. 0 means with the masked window. Every value must be a multiple of
  # every masked window, so 8 is dropped with r = 16.
  padding_windows: [0, 16, 32, 64, 128, 256]
  # Priority 4. Off, EntropyCache's 1.5, and 0.5, which fires about 6 times per task;
  # 0.25 and 1.0 added.
  entropy_thresholds: [0.0, 1.5, 0.5, 0.25, 1.0]
  entropy_scopes: [local, full]
  crossover_probability: 0.9
  two_gene_mutation_probability: 0.2
  # Thresholds from EAR_VALIDITY_STUDY.md; coverage from the masked-reuse study.
  min_ear: 0.9870
  min_tail_ear: 0.9758
  min_answer_coverage: 0.99
  # Padded FLOPs at batch 8: every request is charged its batch's largest row count,
  # which is what the batched backend computes. Run 3's audit: Spearman 0.83 with measured
  # batch-8 speed, against 0.52 for plain FLOPs (CONSTRAINED_SEARCH.md, 2026-11-15).
  cost_objective: padded_flops
  objective_batch_size: 8
  dense_reference: /scratch/gqs7zr/ai4mat/ecad/results/dlm_kv_policy/constrained_kv_search_v1/dense
  # Batched teacher forcing with vectorized scoring, 16 tasks per forward, along the
  # batch-one dense trajectories (BATCHED_TEACHER_FORCING_CHECK.md; approved 2026-11-13).
  teacher_forcing_batch_size: 16
  dense_trajectories: /scratch/gqs7zr/ai4mat/ecad/results/dlm_kv_policy/constrained_kv_search_v1/dense_trajectories
  # Continues run 3: its survivors are generation 0.
  initial_population: /scratch/gqs7zr/ai4mat/ecad/results/dlm_kv_policy/constrained_kv_search_v3/generation_023/summary.json
