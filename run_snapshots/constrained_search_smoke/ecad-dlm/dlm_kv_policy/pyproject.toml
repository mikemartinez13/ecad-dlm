[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dlm-kv-policy"
version = "0.1.0"
description = "Active-token KV recomputation policies for DiffuCoder"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["dlm_kv_policy"]
package-dir = {dlm_kv_policy = "."}
